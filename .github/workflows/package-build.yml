name: package-build

# ============================================================================
# Матричная сборка ROS 2-пакетов (п. 3.5 ТЗ): 3 платформы × 2 типа сборки.
#
# Требуемые ТЗ комбинации:
#   [обязательно] x86_64                      — нативно на x86-раннере
#   [обязательно] AGX Orin  / JP 6.2.2        — кросс на x86 через QEMU
#   [обязательно] Orin Nano / JP 7            — кросс на x86 через QEMU
#   [опционально] AGX Orin  / JP 6.2.2        — нативно на ARM64-раннере
#   [опционально] Orin Nano / JP 7            — нативно на ARM64-раннере
#
# Нативные ARM-сборки идут на бесплатных hosted-раннерах GitHub
# (ubuntu-22.04-arm / ubuntu-24.04-arm, Cobalt 100, 4 vCPU). Их можно
# переключить на self-hosted раннер, поднятый на самом Jetson, — тогда к
# нативной сборке добавится ещё и рантайм-тест на реальном GPU
# (см. docs/02-deployment.md, раздел «Self-hosted раннер на Jetson»).
#
# Теги образов различают способ сборки:
#   <pkg>:<platform>-native   /   <pkg>:<platform>-cross
# Это позволяет сравнить артефакты и убедиться, что кросс-сборка даёт то же,
# что нативная (docs/05-verification.md).
# ============================================================================

on:
  # Автозапуск только по тегу: сборка пакета имеет смысл лишь тогда,
  # когда базовые образы уже опубликованы в реестре. На обычный push
  # в main workflow не реагирует, чтобы не плодить заведомо падающие
  # прогоны — для отладки есть ручной запуск.
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      package:
        description: 'Пакет из packages/*.env'
        type: string
        default: fast_lio2
      platforms:
        description: 'Платформы через запятую (пусто = все)'
        type: string
        default: ''
      include_native_arm:
        description: 'Собирать ещё и нативно на ARM64-раннерах'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  PACKAGE: ${{ github.event.inputs.package || 'fast_lio2' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        env:
          ONLY: ${{ inputs.platforms }}
          WITH_NATIVE_ARM: ${{ inputs.include_native_arm == false && 'false' || 'true' }}
        run: |
          set -euo pipefail
          entries='[]'
          # На каких ROS-дистрибутивах пакет заявлен рабочим. Платформы с
          # другим дистрибутивом в матрицу не попадают: собирать заведомо
          # несовместимое бессмысленно, а красный прогон скрывал бы реальные
          # отказы. Пропуск виден в логе job'а plan.
          pkg_distros="$( set -a; . "packages/${PACKAGE}.env" 2>/dev/null; set +a
                          echo "${SUPPORTED_ROS_DISTROS:-}" )"
          add() { entries="$(jq -c --arg p "$1" --arg r "$2" --arg m "$3" \
                    '. + [{platform:$p, runner:$r, mode:$m}]' <<<"${entries}")"; }
          for f in platforms/*.env; do
            id="$(basename "$f" .env)"
            if [ -n "${ONLY}" ] && ! echo ",${ONLY}," | grep -q ",${id},"; then continue; fi
            set -a; source "$f"; set +a
            if [ -n "${pkg_distros}" ] \
               && ! printf ' %s ' "${pkg_distros}" | grep -q " ${ROS_DISTRO} "; then
                echo "::notice title=Платформа пропущена::${id}: пакет ${PACKAGE} заявлен для ROS «${pkg_distros}», платформа использует ${ROS_DISTRO}"
                continue
            fi
            if [ "${DOCKER_PLATFORM}" = "linux/amd64" ]; then
              add "${id}" "ubuntu-24.04" "native"          # x86 нативно
            else
              add "${id}" "ubuntu-24.04" "cross"           # ARM64 через QEMU
              if [ "${WITH_NATIVE_ARM}" = "true" ]; then
                add "${id}" "${NATIVE_RUNNER}" "native"    # ARM64 нативно
              fi
            fi
          done
          echo "include=${entries}" >> "$GITHUB_OUTPUT"
          jq . <<<"${entries}"

  build:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Кросс-сборки под QEMU держим по одной: они упираются в память
      # и в диск раннера, параллельный запуск даёт OOM.
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    name: ${{ matrix.platform }} · ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Освободить место на раннере
        if: ${{ !startsWith(matrix.runner, 'self-hosted') }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Настроить QEMU
        if: matrix.mode == 'cross'
        run: ./scripts/setup-qemu.sh

      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Определить владельца образов в нижнем регистре
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_OUTPUT"

      - name: Собрать образ пакета
        id: build
        run: |
          ./scripts/build-package.sh \
            --package "${PACKAGE}" \
            --platform "${{ matrix.platform }}" \
            --mode "${{ matrix.mode }}" \
            --push --no-load \
            --tag "${GITHUB_SHA::7}"

      # Тестирование собранных образов — обязательный пункт ТЗ.
      # Пулим только что запушенный образ и прогоняем полный набор проверок.
      - name: Проверить образ
        run: |
          IMG="ghcr.io/${{ steps.owner.outputs.value }}/${PACKAGE}:${{ matrix.platform }}-${{ matrix.mode }}"
          docker pull --platform "$(grep -oP 'DOCKER_PLATFORM="\K[^"]+' platforms/${{ matrix.platform }}.env)" "${IMG}"
          ./scripts/verify-image.sh \
            --image "${IMG}" \
            --platform "${{ matrix.platform }}" \
            --package "${PACKAGE}" \
            --report "verify-${{ matrix.platform }}-${{ matrix.mode }}.md"
          cat "verify-${{ matrix.platform }}-${{ matrix.mode }}.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-${{ env.PACKAGE }}-${{ matrix.platform }}-${{ matrix.mode }}
          path: verify-*.md
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # Сводка: собирает отчёты всех сборок в один и сравнивает результаты
  # нативной и кросс-сборки одной платформы.
  # ---------------------------------------------------------------------
  summary:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: reports
      - name: Собрать сводный отчёт
        run: |
          {
            echo "# Сводка сборки \`${PACKAGE}\`"
            echo
            echo "Коммит: \`${GITHUB_SHA}\`"
            echo
            find reports -name 'verify-*.md' | sort | while read -r f; do
              echo "---"; cat "$f"; echo
            done
          } | tee "$GITHUB_STEP_SUMMARY" > summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: build-summary
          path: summary.md
